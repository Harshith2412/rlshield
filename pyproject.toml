[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "rlshield"
version = "0.1.0"
description = "Plug-and-play security hardening for Reinforcement Learning pipelines"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Harshith Madhavaram", email = "madhavaram.harshith2412@gmail.com" }
]
keywords = [
    "reinforcement-learning",
    "security",
    "adversarial",
    "machine-learning",
    "cybersecurity",
    "ppo",
    "dqn",
    "sac",
    "rlhf",
    "safety"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = [
    "numpy>=1.21.0",
]

[project.optional-dependencies]
torch = ["torch>=1.9.0"]
gym   = ["gymnasium>=0.26.0"]
sb3   = ["stable-baselines3>=2.0.0"]
dev   = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "build>=0.10",
    "twine>=4.0",
]
all = [
    "torch>=1.9.0",
    "gymnasium>=0.26.0",
    "stable-baselines3>=2.0.0",
]

[project.urls]
Homepage      = "https://github.com/Harshith2412/rlshield"
Repository    = "https://github.com/Harshith2412/rlshield"
Issues        = "https://github.com/Harshith2412/rlshield/issues"
Documentation = "https://github.com/Harshith2412/rlshield#readme"

[tool.setuptools.packages.find]
where   = ["."]
include = ["rlshield*"]
exclude = ["tests*", "*.tests*"]

[tool.pytest.ini_options]
testpaths    = ["rlshield/tests"]
python_files = ["test_*.py"]

[tool.setuptools.package-data]
rlshield = ["py.typed"]